# This is the only route table. Applications send model_name, never litellm_params.model.
model_list:
  - model_name: chat
    litellm_params:
      model: openai/deepseek/deepseek-v4.1-flash
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/HOMELAB_GATEWAY_API_KEY
      reasoning_effort: low
  - model_name: grade
    litellm_params:
      model: openai/deepseek/deepseek-v4.1-flash
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/HOMELAB_GATEWAY_API_KEY
      reasoning_effort: low
  - model_name: translate
    litellm_params:
      model: openai/deepseek/deepseek-v4.1-flash
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/HOMELAB_GATEWAY_API_KEY
      reasoning_effort: low
  - model_name: chat:high
    litellm_params:
      model: openai/deepseek/deepseek-v4.1-flash
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/HOMELAB_GATEWAY_API_KEY
      reasoning_effort: medium
  - model_name: chat:xhigh
    litellm_params:
      model: openai/deepseek/deepseek-v4.1-flash
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/HOMELAB_GATEWAY_API_KEY
      reasoning_effort: high
  - model_name: vision
    litellm_params:
      model: openai/vision
      api_base: os.environ/HOMELAB_MAC_VISION_URL
      api_key: none
      timeout: 300.0
    model_info:
      # The deployment hook applies this separately from the page request timeout.
      connect_timeout: 3.0
  # Native LiteLLM wildcard substitution preserves the requested router preset name.
  - model_name: vision-*
    litellm_params:
      model: openai/vision-*
      api_base: os.environ/HOMELAB_MAC_VISION_URL
      api_key: none
      timeout: 300.0
    model_info:
      connect_timeout: 3.0
  - model_name: vision:xhigh
    litellm_params:
      model: openai/deepseek/deepseek-v4.1-flash
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/HOMELAB_GATEWAY_API_KEY
  - model_name: embed
    litellm_params:
      model: openai/llama-nemotron-embed-1b-v2
      api_base: http://llama-embed:8080/v1
      api_key: none
    model_info:
      mode: embedding
      input_prefixes:
        query: "query: "
        passage: "passage: "
  - model_name: embed-large
    litellm_params:
      model: openai/Qwen3-Embedding-4B
      api_base: http://llama-embed-large:8080/v1
      api_key: none
    model_info:
      mode: embedding
      input_prefixes:
        query: "Instruct: Given a question, retrieve passages that answer the question\nQuery:"
        passage: ""
  - model_name: embed-large-bulk
    litellm_params:
      model: openai/Qwen3-Embedding-4B
      api_base: os.environ/HOMELAB_MAC_EMBED_URL
      api_key: none
      timeout: 300.0
    model_info:
      connect_timeout: 3.0
      mode: embedding
      input_prefixes:
        query: "Instruct: Given a question, retrieve passages that answer the question\nQuery:"
        passage: ""

  # Sources and direct proof results are in docs/operations.md.
  - model_name: embed-large-bulk-*
    litellm_params:
      model: openai/embed-large-bulk-*
      api_base: os.environ/HOMELAB_MAC_EMBED_URL
      api_key: none
      timeout: 300.0
    model_info:
      connect_timeout: 3.0
      mode: embedding
      input_prefixes:
        query: "Instruct: Given a question, retrieve passages that answer the question\nQuery:"
        passage: ""
  - model_name: image-gpt-2.5-flare
    litellm_params:
      model: openai/openai/gpt-image-2.5-flare
      # GPT images are always base64. LiteLLM's generation-param check rejects this
      # legacy selector even on edits; its native setting avoids that check.
      additional_drop_params: [response_format]
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/HOMELAB_IMAGE_GATEWAY_API_KEY
      timeout: 300.0
    model_info:
      mode: image_generation
      display_name: GPT Image 2.5 Flare
      paid: true
      placeholder: false
      seconds_per_image: 10.074
      licence: You own output as between you and OpenAI, subject to OpenAI terms and applicable law.
      endpoint: images/edits
      response: b64_json
      prompt_family: openai
      max_prompt_chars: 32000
      max_references: 16
      reference_max_side: 2048
      aspect_ratios:
        field: size
        values: {"1:1": "1024x1024", "3:2": "1536x1024", "2:3": "1024x1536", "16:9": "1536x864", "9:16": "864x1536"}
      qualities:
        field: quality
        values: [low, medium, high, xhigh, max, auto]
      advanced:
        - {name: background, type: string, values: [auto, opaque, transparent], default: auto}
        - {name: output_format, type: string, values: [png, jpeg, webp], default: png}
        - {name: output_compression, type: integer, range: [0, 100], default: 100}
        - {name: moderation, type: string, values: [auto, low], default: auto}
      # Approximate output-only USD at 1024x1024; excludes text/reference tokens.
      price_per_image: {low: 0.00588, medium: 0.0132, high: 0.05268, xhigh: 0.09366, max: 0.21072}
      price_per_reference: 0.0122
      price_estimated: true
      price_checked: "2026-10-14"
  - model_name: image-gpt-2.5-sunburst
    litellm_params:
      model: openai/openai/gpt-image-2.5-sunburst
      additional_drop_params: [response_format]
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/HOMELAB_IMAGE_GATEWAY_API_KEY
      timeout: 300.0
    model_info:
      mode: image_generation
      display_name: GPT Image 2.5 Sunburst
      paid: true
      placeholder: false
      seconds_per_image: 8.718
      licence: You own output as between you and OpenAI, subject to OpenAI terms and applicable law.
      endpoint: images/edits
      response: b64_json
      prompt_family: openai
      max_prompt_chars: 32000
      max_references: 16
      reference_max_side: 2048
      aspect_ratios:
        field: size
        values: {"1:1": "1024x1024", "3:2": "1536x1024", "2:3": "1024x1536", "16:9": "1536x864", "9:16": "864x1536"}
      qualities:
        field: quality
        values: [low, medium, high, xhigh, max, auto]
      advanced:
        - {name: background, type: string, values: [auto, opaque, transparent], default: auto}
        - {name: output_format, type: string, values: [png, jpeg, webp], default: png}
        - {name: output_compression, type: integer, range: [0, 100], default: 100}
        - {name: moderation, type: string, values: [auto, low], default: auto}
      price_per_image: {low: 0.00588, medium: 0.0132, high: 0.05268, xhigh: 0.09366, max: 0.21072}
      price_per_reference: 0.0122
      price_estimated: true
      price_checked: "2026-10-14"
  - model_name: image-nano-banana-2.1
    litellm_params:
      model: openai/google/gemini-nano-banana-2.1
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/HOMELAB_IMAGE_GATEWAY_API_KEY
      timeout: 300.0
    model_info:
      mode: image_generation
      display_name: Nano Banana 2.1
      paid: true
      placeholder: false
      # 14.147s for the call, which returned two message images.
      seconds_per_image: 7.074
      licence: Google does not claim ownership of generated content; Gemini API terms apply.
      endpoint: chat/completions
      response: message_images
      prompt_family: gemini
      max_references: 14
      reference_slots: {object: 10, character: 4}
      reference_max_side: 2048
      aspect_ratios:
        field: providerOptions.google.imageConfig.aspectRatio
        values: ["1:1", "1:4", "1:8", "2:3", "3:2", "3:4", "4:1", "4:3", "4:5", "5:4", "8:1", "9:16", "16:9", "21:9"]
      resolutions:
        field: providerOptions.google.imageConfig.imageSize
        values: [1K, 2K, 4K]
      advanced:
        - {name: reasoning_effort, type: string, values: [minimal, medium, high], default: medium}
      price_per_image: {1K: 0.0336, 2K: 0.0504, 4K: 0.1134}
      price_estimated: true
      price_checked: "2026-10-14"

router_settings:
  num_retries: 0
  fallbacks: []
  context_window_fallbacks: []
  content_policy_fallbacks: []
  disable_cooldowns: true

litellm_settings:
  callbacks: litellm_hooks.hooks
  telemetry: false
  set_verbose: false
  suppress_debug_info: true
  turn_off_message_logging: true
  drop_params: false

general_settings:
  disable_spend_logs: true
  forward_client_headers_to_llm_api: false
  forward_llm_provider_auth_headers: false
