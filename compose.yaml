# Home Lab v2 — the whole stack. Only `api` publishes a port, on loopback. Everything derived
# (Postgres data, model files) lives on the encrypted volume; Brain is mounted read-only.
# Paths and the database password come from .env (see .env.example); the gateway key is a secret.

name: homelab

x-app: &app
  build: .
  environment: &app-env
    HOMELAB_DATABASE_URL: postgresql://homelab:${HOMELAB_DB_PASSWORD}@postgres:5432/homelab
    HOMELAB_MODELS_BASE_URL: ${HOMELAB_MODELS_BASE_URL:-http://litellm:4000/v1}
    HOMELAB_MODELS_API_KEY: ${HOMELAB_MODELS_API_KEY:-homelab}
    HOMELAB_BRAIN_DIR: /data/brain
    HOMELAB_ACTIVE_COLLECTION: ${HOMELAB_ACTIVE_COLLECTION:-about_aleix}
    HOMELAB_CORPUS_FILE: ${HOMELAB_CORPUS_FILE:-/data/corpus/about-aleix/corpus.json}
    HOMELAB_EVAL_FILE: ${HOMELAB_EVAL_FILE:-/data/corpus/about-aleix/eval.json}
  volumes:
    - ${HOMELAB_BRAIN_PATH:-/srv/homelab/brain}:/data/brain:ro
    - ${HOMELAB_CORPUS_PATH:-/srv/homelab/corpus}:/data/corpus:ro
  depends_on:
    postgres:
      condition: service_healthy
    litellm:
      condition: service_healthy
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: journald

services:
  litellm:
    # Official release 2026-10-03. Deliberate digest updates only; never PyPI or latest.
    image: ghcr.io/berriai/litellm:v1.103.3@sha256:e6e1c46cec92ab58b7ff95c790420aba9f05269b662a66c0dd11714171b9c64b
    user: "10001:10001"
    entrypoint: ["python", "/etc/litellm/litellm_entrypoint.py"]
    environment:
      HOMELAB_MAC_VISION_URL: ${HOMELAB_MAC_VISION_URL:-http://127.0.0.1:9/v1}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      LITELLM_MODE: PRODUCTION
      DISABLE_ADMIN_UI: "True"
      DO_NOT_TRACK: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    secrets:
      - gateway_api_key
    volumes:
      - ./config:/etc/litellm:ro
    networks:
      - default
      - models
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: journald
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 30s
      timeout: 5s
      start_period: 90s
    depends_on:
      llama-embed:
        condition: service_started

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  worker:
    <<: *app
    # One local-model job at a time: the `local` queue is served with concurrency 1.
    command:
      - /bin/sh
      - -c
      - >-
        python -m homelab.jobs.schema &&
        exec procrastinate --app homelab.jobs.app.app worker
        --queues local,default --concurrency 1

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: ${HOMELAB_DB_PASSWORD}
      POSTGRES_DB: homelab
    volumes:
      - ${HOMELAB_POSTGRES_PATH:-/srv/homelab/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelab -d homelab"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: journald

  llama-embed:
    # llama.cpp server, CPU only, serving the `embed` route. The model is fetched from Hugging
    # Face on first start into the models directory on the volume. The name must match the
    # `embed` route in config/litellm.yaml in spirit; llama-server serves one model per instance.
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -hf ${HOMELAB_EMBED_MODEL:-mradermacher/llama-nemotron-embed-1b-v2-GGUF:Q8_0}
      --embeddings --pooling mean
      -c 8192 -b 2048 -ub 2048 -t 4 -ngl 0
      --host 0.0.0.0 --port 8080
    environment:
      LLAMA_CACHE: /models
    volumes:
      - ${HOMELAB_MODELS_PATH:-/srv/homelab/models}:/models
    restart: unless-stopped
    logging:
      driver: journald

secrets:
  gateway_api_key:
    file: ./secrets/gateway_api_key

networks:
  models:
    name: homelab-models
