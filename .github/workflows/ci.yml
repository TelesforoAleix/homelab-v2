name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group benchmark --group telegram-bot
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Validate node shell and runtime configuration
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n node/usr/local/sbin/data-volume.sh
          shellcheck node/usr/local/sbin/*.sh
          dockerd --validate --config-file=node/etc/docker/daemon.json
          containerd --config node/etc/containerd/config.toml config dump > /dev/null
      - name: Verify host bot requirements on Python 3.14
        run: |
          uv python install 3.14
          uv run --python 3.14 --no-project python -m venv "$RUNNER_TEMP/bot-venv"
          "$RUNNER_TEMP/bot-venv/bin/python" -m pip install --require-hashes -r node/opt/homelab-telegram-bot/requirements.txt
          "$RUNNER_TEMP/bot-venv/bin/python" -c 'import telegram; print(telegram.__version__)'
          sudo mkdir -p /opt/homelab-telegram-bot
          sudo ln -s "$RUNNER_TEMP/bot-venv" /opt/homelab-telegram-bot/.venv
          sudo systemd-analyze verify node/etc/systemd/system/homelab-telegram-bot.service node/etc/systemd/system/homelab-bot-data-ready.service node/etc/systemd/system/homelab-bot-data-released.service
      - run: uv run pytest
      - run: docker build -t homelab:ci .
      - name: Verify the pinned LiteLLM image without external networking or real secrets
        run: |
          IMAGE=$(uv run python -c 'import yaml; print(yaml.safe_load(open("compose.yaml"))["services"]["litellm"]["image"])')
          mkdir -p "$RUNNER_TEMP/litellm-check/config" "$RUNNER_TEMP/litellm-check/tests"
          cp compose.yaml "$RUNNER_TEMP/litellm-check/"
          cp config/litellm* "$RUNNER_TEMP/litellm-check/config/"
          cp tests/litellm_smoke.py "$RUNNER_TEMP/litellm-check/tests/"
          docker run --rm --network none --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges -v "$RUNNER_TEMP/litellm-check:/work:ro" \
            --entrypoint python "$IMAGE" /work/tests/litellm_smoke.py
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  menu-bar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the menu bar app as the installer does
        run: swift build --package-path mac/MenuBar -c release
  fence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the fence images without pushing
        run: |
          docker build -t homelab-fence:1 node/opt/homelab-fence/cli
          docker build -t homelab-fence-proxy:1 node/opt/homelab-fence/proxy
      - name: Check the pinned CLI versions inside the fence image
        run: |
          docker run --rm --network none homelab-fence:1 sh -ec '
            claude --version | tee /tmp/claude-version
            codex --version | tee /tmp/codex-version
            grep -Fx "2.1.318 (Claude Code)" /tmp/claude-version
            grep -Fx "codex-cli 0.162.1" /tmp/codex-version
          '
