# Home Lab — SSH server hardening
#
# Phase 03 (Remote Access). See docs/handovers/03-remote-access.md and ADR-018.
#
# Applied to : /etc/ssh/sshd_config.d/10-homelab-hardening.conf
# Ownership  : root:root
# Mode       : 0600  (sshd reads this as root, so it needs no wider access.
#              Ubuntu's own 50-cloud-init.conf in this directory is 0600 root
#              root, and matching that is both tighter and consistent.)
#
# ---------------------------------------------------------------------------
# WHY THIS FILE IS NUMBERED 10- AND NOT 99-
# ---------------------------------------------------------------------------
# This is the single most important thing to understand about the file, and it
# is the opposite of what almost everyone assumes.
#
# /etc/ssh/sshd_config begins with:
#
#     Include /etc/ssh/sshd_config.d/*.conf
#
# The shell glob expands in lexical order, so 10-... is read before 50-... .
# And sshd does NOT behave like most config systems: for most keywords
# **the FIRST value wins** and every later one is ignored. Last-one-wins is
# the wrong mental model here.
#
# Ubuntu ships /etc/ssh/sshd_config.d/50-cloud-init.conf containing:
#
#     PasswordAuthentication yes
#
# A file named 99-homelab-hardening.conf would therefore be read AFTER that,
# its PasswordAuthentication no would be silently discarded, passwords would
# still be accepted, and the repository would claim otherwise. The number in
# this filename is a security control, not housekeeping.
#
# Never trust the file. Verify what sshd actually resolved:
#
#     sudo sshd -T | grep -E 'passwordauthentication|kbdinteractive'
#
# ---------------------------------------------------------------------------

# Refuse passwords outright. This is the line that closes Phase 01's principal
# open risk. Until Phase 03 this server accepted any password that matched, from
# anyone who could reach port 22.
PasswordAuthentication no

# Keyboard-interactive is a separate authentication method that PAM can use to
# ask for a password by another route. Disabling PasswordAuthentication alone
# leaves this door open, so both are needed. This pairing is the usual reason
# someone "disabled passwords" and is still getting a password prompt.
KbdInteractiveAuthentication no

# State the mechanism we do want explicitly, rather than relying on the default
# staying "yes" across future OpenSSH releases.
PubkeyAuthentication yes

# Phase 01 left this at prohibit-password, which permits root login by key.
# No root key exists and none should, so nothing is lost by refusing outright.
# Administration goes through aleix + sudo (ADR-011, privilege separation).
PermitRootLogin no

# Belt and braces: require public key and nothing else, for every user. If some
# future package drops in a config that re-enables another method, this still
# refuses it. Revisit in Phase 13 if a second factor is ever added, since that
# is expressed here too (e.g. "publickey,keyboard-interactive").
AuthenticationMethods publickey

# ---------------------------------------------------------------------------
# Phase 13 (security hardening, S2). See docs/handovers/13-security-hardening.md §6.9.
# Each of the four below was OBSERVED absent or at its default on 2026-09-12
# (`sshd -T`: no allowusers, maxauthtries 6, x11forwarding yes,
# allowagentforwarding yes). What is NOT changed: ListenAddress (binding to
# tailscale0's address would race the interface at boot; ufw already filters),
# AllowTcpForwarding (the Workbench tunnel alias is a LocalForward and needs it).
# ---------------------------------------------------------------------------

# Only the admin account and the executor agent's account may authenticate.
# `homelab-bot`, `homelab-harness` and any future service account are refused
# before a key is even looked at. Never a service here. First-value-wins
# applies: keep this file at 10-.
#
# Phase 13.1 (ADR-049): `homelab-agent` is an OPERATOR account, not a service
# -- it runs no unit, holds no credential, and its sudo grant is the closed
# list in config/sudoers.d/homelab-agent. Adding it here was the phase's one
# lockout-class step (second session, sshd -t, reload, third connection).
AllowUsers aleix homelab-agent

# Three attempts per connection. With one key offered by every client we own
# this is never reached legitimately; it shortens the window for a stolen-key
# guess against a host that is only reachable over the tailnet anyway.
MaxAuthTries 3

# Nothing on a headless node draws windows. Off rather than default-on.
X11Forwarding no

# The node has its own GitHub key (18.2). No client forwards an agent to it,
# and the MacBook's config says `forwardagent no`. Refuse it server-side so a
# future client misconfiguration cannot lend the MacBook's key to the node.
AllowAgentForwarding no
