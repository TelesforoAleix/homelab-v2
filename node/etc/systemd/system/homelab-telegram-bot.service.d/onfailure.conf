# Phase 12 -- alert the owner if the bot dies.
#
# Installed to /etc/systemd/system/homelab-telegram-bot.service.d/onfailure.conf
#
# A drop-in, not an edit to homelab-telegram-bot.service itself: ADR-023
# governs that file as a complete, reviewable security-boundary document, and
# a drop-in adds behaviour without touching that committed text -- and is
# trivially removable. Verify `systemd-analyze security homelab-telegram-bot`
# is still 1.3 OK and `id homelab-bot` is still byte-identical WITH this
# drop-in installed, not only before it exists -- a drop-in can still add
# directives, so its absence from the base file is not proof by itself (§8).
#
# The alias is the literal string "bot", never %n or %N -- systemd escapes
# "-" as \x2d in specifier expansions (Phase 18.1 defect 4), and
# homelab-notify@.service maps this literal alias to the real unit name
# itself, sidestepping that class of mistake entirely.
[Unit]
OnFailure=homelab-notify@bot.service
