# Phase 13 §6.6 -- the bot token at rest is sealed to this machine's TPM2.
#
# Installed to /etc/systemd/system/<unit>.d/credential.conf. Identical in the
# three units that load the token: homelab-telegram-bot, homelab-notify@,
# homelab-watchdog (all three or none -- brief §6.6). A drop-in, not an edit
# to the base unit: the base unit keeps its plain LoadCredential= line and its
# reasoning; this file overrides it, and removing this file is the rollback.
#
# The credential's NAME is unchanged (bot-token), so the code that reads
# $CREDENTIALS_DIRECTORY/bot-token does not know or care. What changed is the
# file on disk: /etc/homelab-telegram-bot/token.cred is
#   systemd-creds encrypt --with-key=tpm2 --tpm2-pcrs=""
# -- sealed to the TPM, bound to NO PCRs. A pulled disk cannot decrypt it (no
# TPM). A USB boot on the same machine still can (same TPM) -- ADR-046 §4 said
# so; that path is the BIOS password's job. No PCR binding on purpose: PCR 7
# (Secure Boot policy) would add nothing against those two threats and would
# turn a firmware update or a Secure Boot toggle into a silent bot -- the
# failure mode ADR-046 §2 exists to prevent.
#
# The empty LoadCredential= resets the list inherited from the base unit.
[Service]
LoadCredential=
LoadCredentialEncrypted=bot-token:/etc/homelab-telegram-bot/token.cred
