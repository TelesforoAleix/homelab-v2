# The bot token at rest is sealed to this machine's TPM2.
# Installed to /etc/systemd/system/<unit>.d/credential.conf.
#
# The notifier, watchdog and bot use identical overrides. The base units
# retain their plain LoadCredential=; this drop-in replaces that source.
# The credential name stays bot-token, so scripts still read the private
# $CREDENTIALS_DIRECTORY/bot-token supplied by PID 1.
#
# token.cred was encrypted with --with-key=tpm2 --tpm2-pcrs="".
# A removed disk cannot decrypt it without the TPM; a USB boot on the same
# machine can, so that threat is handled by the BIOS password.
# No PCR binding: PCR 7 would not address either threat and would make
# firmware or Secure Boot changes prevent the bot from reading its token.
# The empty LoadCredential= resets the inherited list.
[Service]
LoadCredential=
LoadCredentialEncrypted=bot-token:/etc/homelab-telegram-bot/token.cred
