# Home Lab — swap tendency
#
# Phase 05. Closes an item Phase 01 raised and named Phase 05 as the trigger for.
#
# vm.swappiness is how eagerly the kernel moves anonymous pages to swap. It is
# NOT a percentage of memory and it is not a threshold; it is a weighting
# between reclaiming page cache and swapping anonymous pages.
#
# Ubuntu ships 60, which is tuned for desktops where a background application
# may sit idle for hours and is better off swapped out. This is a server whose
# processes are all things we want resident.
#
# Decided from this machine's measured behaviour, not from folklore:
#   total 7.1 Gi, used 1.3 Gi, available 5.9 Gi, swap 4.0 Gi with 0 B in use.
# There is no memory pressure today, and Docker is about to add long-lived
# container processes that should stay in RAM.
#
# 10 keeps swap available as a safety net under genuine pressure while making
# the kernel strongly prefer reclaiming cache first. 0 is NOT chosen: it does
# not disable swap, it makes the kernel avoid it until it is nearly out of
# memory, which trades graceful degradation for a sharper OOM cliff.
vm.swappiness = 10
