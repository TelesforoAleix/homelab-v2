# Compose runs this as an unprivileged user on a read-only root. With no LogFile, tinyproxy logs
# to stdout, which journald keeps: host names and refusals, no content.
Port 8888
Timeout 120
MaxClients 32
LogLevel Connect
DisableViaHeader Yes

# Only CONNECT to port 443. FilterURLs matches a tunnel as `host:443` and a plain request as
# `http://host/...`, so the anchored rules in package-hosts refuse plain HTTP to the same hosts.
ConnectPort 443
Filter "/etc/tinyproxy/package-hosts"
FilterURLs On
FilterDefaultDeny Yes
