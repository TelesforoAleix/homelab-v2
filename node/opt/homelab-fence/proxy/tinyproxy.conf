Port 8888
Timeout 120
MaxClients 32
# No request/URL logging: login codes and credentials must not enter Docker logs.
LogLevel Critical
DisableViaHeader Yes
ConnectPort 443
# FilterURLs sees CONNECT as host:port; anchored expressions reject ordinary HTTP.
Filter "/etc/tinyproxy/allowed-hosts"
FilterType ere
FilterCaseSensitive No
FilterURLs On
FilterDefaultDeny Yes
