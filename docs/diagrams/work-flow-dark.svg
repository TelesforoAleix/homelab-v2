<text x="363.0" y="129.9" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#F2F2EF" text-anchor="middle">Research, design</text>
<text x="363.0" y="146.9" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#F2F2EF" text-anchor="middle">and stress-test</text>
<text x="363.0" y="163.9" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#F2F2EF" text-anchor="middle">with AI sparring</text>
