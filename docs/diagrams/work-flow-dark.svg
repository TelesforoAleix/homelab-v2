<text x="40" y="146.0" font-family='"SFMono-Regular", Consolas, monospace' font-size="12" font-weight="400" fill="#A3A39D" text-anchor="start" letter-spacing="1">PLANNER</text>
<text x="40" y="234.0" font-family='"SFMono-Regular", Consolas, monospace' font-size="12" font-weight="400" fill="#A3A39D" text-anchor="start" letter-spacing="1">FACTORY</text>
<text x="40" y="336.0" font-family='"SFMono-Regular", Consolas, monospace' font-size="12" font-weight="400" fill="#A3A39D" text-anchor="start" letter-spacing="1">PLATFORM</text>
<text x="40" y="446.0" font-family='"SFMono-Regular", Consolas, monospace' font-size="12" font-weight="400" fill="#A3A39D" text-anchor="start" letter-spacing="1">AGENT</text>
