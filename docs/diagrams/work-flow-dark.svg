<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1240 512" width="1240" height="512" role="img" aria-labelledby="flow-dark-title flow-dark-desc">
<title id="flow-dark-title">How one piece of work flows</title>
<desc id="flow-dark-desc">A BPMN-style process in five lanes. I log an idea; a planner researches, designs and stress-tests it with me through AI sparring until the design is agreed, then cuts it into slices. The platform starts a sandbox and an agent writes the change. Factory opens the pull request while an AI reviewer reviews it. If CI fails, the agent repairs the change. A class 4 change waits for my decision. Factory merges, the commit is installed and checked, and an unhealthy install rolls back automatically.</desc>
<defs>
<marker id="flow-dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F2F2EF"/></marker>
<marker id="flow-dark-arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D00"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="512" fill="#171717"/>
