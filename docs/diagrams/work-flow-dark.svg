<text x="712.0" y="426.4" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#F2F2EF" text-anchor="middle">AI reviewer</text>
<text x="712.0" y="443.4" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#F2F2EF" text-anchor="middle">reviews PR</text>
<path d="M764,230 L784,230" fill="none" stroke="#F2F2EF" stroke-width="1" marker-end="url(#flow-dark-arrow)"/>
