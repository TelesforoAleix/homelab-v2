<text x="758.0" y="80.4" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="middle">med-ask, image studio</text>
<rect x="40" y="132" width="860" height="300" rx="4" fill="#F2F2EF" stroke="#CDCDC7" stroke-width="1"/>
<text x="64" y="160" font-family='"SFMono-Regular", Consolas, monospace' font-size="12" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1">LINUX SERVER · ALWAYS ON</text>
<rect x="64" y="178" width="232" height="230" rx="3" fill="#F2F2EF" stroke="#CDCDC7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="88" y="210" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="18" font-weight="600" fill="#171717" text-anchor="start">Factory</text>
<text x="272" y="210" font-family='"SFMono-Regular", Consolas, monospace' font-size="12" font-weight="400" fill="#656560" text-anchor="end" letter-spacing="1">PRIVATE</text>
