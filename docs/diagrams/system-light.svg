<text x="88" y="254" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" fill="#171717"><tspan font-weight="600">Workshop</tspan><tspan fill="#656560"> · web console</tspan></text>
<text x="88" y="286" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">Planning and slices</text>
<text x="88" y="312" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">Briefs and prompts</text>
<text x="88" y="338" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">Record of what ran</text>
