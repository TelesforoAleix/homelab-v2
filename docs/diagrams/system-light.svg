<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="system-light-title system-light-desc">
<title id="system-light-title">Home Lab system context</title>
<desc id="system-light-desc">My phone and laptop reach Workshop, Factory's private web console, and the platform's Telegram bot over a private network. Client applications reach the Home Lab platform on an always-on Linux server. Factory, the development system on the same server, sends work to the platform's run API. The platform routes model requests to hosted providers through one gateway key, or to local models on an Apple Silicon Mac.</desc>
<defs>
<marker id="system-light-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#171717"/></marker>
<marker id="system-light-arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D00"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="470" fill="#F2F2EF"/>
