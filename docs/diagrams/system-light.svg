<text x="640" y="292" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">Durable jobs on Postgres</text>
<text x="404" y="326" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#171717" text-anchor="start">Model routing by purpose</text>
