<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeLab architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    /* Profile: aleix-site. Architecture, layered; doc-wide; static. */
    :root { --paper: #f2f2ef; --ink: #171717; --muted: #656560; --font-sans: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif; --font-mono: "Geist Mono", "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
    .frame { width: 100%; max-width: 1280px; min-width: 0; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1280px; display: block; }
    .figure-title { font-family: var(--font-sans); font-size: 28px; font-weight: 500; fill: var(--ink); }
    .name { font-family: var(--font-sans); font-size: 12px; font-weight: 600; fill: var(--ink); }
    .prose { font-family: var(--font-sans); font-size: 11px; font-weight: 400; fill: var(--muted); }
    .tag { font-family: var(--font-mono); font-size: 9px; font-weight: 400; fill: var(--muted); }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">HomeLab architecture</title>
      <desc id="architecture-desc">HomeLab connects built and planned clients to its API, model routing, knowledge and durable jobs, with a planned tool gate and job capabilities.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#656560"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff4d00"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#171717"/></marker></defs>
      <rect x="0" y="0" width="1280" height="720" rx="0" fill="#f2f2ef"/>
      <text x="40" y="52" class="figure-title" >HomeLab</text>
      <path data-from="clients" data-to="api" d="M 640,172 V 212" fill="none" stroke="#171717" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path data-from="api" data-to="models" d="M 496,316 V 332 Q 496,340 488,340 H 176 Q 168,340 168,348 V 388" fill="none" stroke="#656560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path data-from="api" data-to="knowledge" d="M 592,316 V 348 Q 592,356 584,356 H 492 Q 484,356 484,364 V 388" fill="none" stroke="#656560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path data-from="api" data-to="jobs" d="M 688,316 V 348 Q 688,356 696,356 H 808 Q 816,356 816,364 V 388" fill="none" stroke="#656560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path data-from="api" data-to="tools" d="M 784,316 V 332 Q 784,340 792,340 H 1104 Q 1112,340 1112,348 V 388" fill="none" stroke="#656560" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
      <path data-from="sources" data-to="knowledge" d="M 428,560 V 524" fill="none" stroke="#656560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path data-from="knowledge" data-to="postgres" d="M 540,524 V 532 Q 540,540 548,540 H 728 Q 736,540 736,548 V 560" fill="none" stroke="#656560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path data-from="jobs" data-to="postgres" d="M 816,524 V 560" fill="none" stroke="#656560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path data-from="models" data-to="providers" d="M 168,524 V 560" fill="none" stroke="#656560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <g id="architecture-clients" data-node="clients" data-state="mixed"><rect x="208" y="100" width="864" height="72" rx="6" fill="#f2f2ef"/><rect x="208" y="100" width="864" height="72" rx="6" fill="rgba(23,23,23,0.02)" stroke="#656560" stroke-width="1"/><text x="224" y="124" class="tag" >CLIENTS</text>
      <g data-client="Telegram bot" data-state="built"><rect x="304" y="132" width="140" height="28" rx="4" fill="#f2f2ef" stroke="#656560" stroke-width="1"/><text x="320" y="150" class="name" >Telegram bot</text></g>
      <g data-client="med-ask" data-state="built"><rect x="456" y="132" width="100" height="28" rx="4" fill="#f2f2ef" stroke="#656560" stroke-width="1"/><text x="472" y="150" class="name" >med-ask</text></g>

      <g data-client="Coding agents" data-state="planned"><rect x="808" y="132" width="248" height="28" rx="4" fill="#f2f2ef" stroke="#656560" stroke-width="1" stroke-dasharray="4,3"/><text x="824" y="150" class="name" >Coding agents</text><rect x="980" y="140" width="64" height="12" rx="2" fill="#f2f2ef" stroke="#656560" stroke-width="1"/><text x="1012" y="149" class="tag" text-anchor="middle">PLANNED</text></g>
      </g>
      <g id="architecture-api" data-node="api" data-state="built"><rect x="400" y="212" width="480" height="104" rx="6" fill="#f2f2ef"/><rect x="400" y="212" width="480" height="104" rx="6" fill="#e8e8e3" stroke="#ff4d00" stroke-width="1"/><text x="416" y="240" class="name" >HomeLab API</text><text x="416" y="264" class="prose" >One API for every client; holds the model credentials</text><text x="416" y="288" class="tag" >FastAPI</text></g>
      <g id="architecture-models" data-node="models" data-state="built"><rect x="40" y="388" width="256" height="136" rx="6" fill="#f2f2ef"/><rect x="40" y="388" width="256" height="136" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/><text x="56" y="416" class="name" >Models</text><text x="56" y="440" class="prose" >Route table, purpose → provider</text><text x="56" y="464" class="tag" >LiteLLM</text></g>
      <g id="architecture-knowledge" data-node="knowledge" data-state="built"><rect x="320" y="388" width="328" height="136" rx="6" fill="#f2f2ef"/><rect x="320" y="388" width="328" height="136" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/><text x="336" y="416" class="name" >Knowledge</text><text x="336" y="440" class="prose" >Ingest, index, retrieve, answer with sources</text><text x="336" y="464" class="tag" >LlamaIndex</text></g>
      <g id="architecture-jobs" data-node="jobs" data-state="built"><rect x="672" y="388" width="288" height="136" rx="6" fill="#f2f2ef"/><rect x="672" y="388" width="288" height="136" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/><text x="688" y="416" class="name" >Jobs</text><text x="688" y="440" class="prose" >Durable background jobs</text><text x="688" y="464" class="tag" >Procrastinate</text><rect x="688" y="476" width="256" height="36" rx="4" fill="#f2f2ef" stroke="#656560" stroke-width="1" stroke-dasharray="4,3"/><rect x="868" y="488" width="64" height="12" rx="2" fill="#f2f2ef" stroke="#656560" stroke-width="1"/><text x="900" y="497" class="tag" text-anchor="middle">PLANNED</text><text x="700" y="498" class="prose" >Job API · local batch jobs</text></g>
      <g id="architecture-tools" data-node="tools" data-state="planned"><rect x="984" y="388" width="256" height="136" rx="6" fill="#f2f2ef"/><rect x="984" y="388" width="256" height="136" rx="6" fill="rgba(23,23,23,0.02)" stroke="#171717" stroke-width="1" stroke-dasharray="4,3"/><text x="1000" y="416" class="name" >Tools</text><text x="1000" y="440" class="prose" >MCP servers behind a tool gate</text><text x="1000" y="464" class="tag" >MCP</text><rect x="1160" y="404" width="64" height="12" rx="2" fill="#f2f2ef" stroke="#656560" stroke-width="1"/><text x="1192" y="413" class="tag" text-anchor="middle">PLANNED</text></g>
      <g id="architecture-providers" data-node="providers" data-state="built"><rect x="40" y="560" width="256" height="96" rx="6" fill="#f2f2ef"/><rect x="40" y="560" width="256" height="96" rx="6" fill="rgba(23,23,23,0.03)" stroke="#656560" stroke-width="1"/><text x="56" y="588" class="name" >Providers</text><text x="56" y="612" class="prose" >Hosted via Vercel AI Gateway</text><text x="56" y="636" class="tag" >local llama.cpp · Mac vision on demand</text></g>
      <g id="architecture-sources" data-node="sources" data-state="built"><rect x="320" y="560" width="328" height="96" rx="6" fill="#f2f2ef"/><rect x="320" y="560" width="328" height="96" rx="6" fill="rgba(23,23,23,0.02)" stroke="#656560" stroke-width="1"/><text x="336" y="588" class="name" >Sources</text><text x="336" y="612" class="prose" >Notes and a JSON corpus</text><text x="336" y="636" class="tag" >Markdown is the truth</text></g>
      <g id="architecture-postgres" data-node="postgres" data-state="built"><rect x="684" y="560" width="244" height="96" rx="6" fill="#f2f2ef"/><rect x="684" y="560" width="244" height="96" rx="6" fill="rgba(23,23,23,0.05)" stroke="#656560" stroke-width="1"/><text x="700" y="588" class="name" >Postgres + pgvector</text><text x="700" y="612" class="prose" >Jobs and vectors</text></g>
      <line x1="40" y1="668" x2="1240" y2="668" stroke="#cdcdc7" stroke-width="0.8"/>
      <text x="40" y="700" class="tag" >LEGEND</text><rect x="120" y="684" width="24" height="20" rx="2" fill="#f2f2ef" stroke="#171717" stroke-width="1"/><text x="156" y="700" class="prose" >Built</text><rect x="232" y="684" width="24" height="20" rx="2" fill="#f2f2ef" stroke="#171717" stroke-width="1" stroke-dasharray="4,3"/><text x="268" y="700" class="prose" >Planned</text><rect x="328" y="688" width="64" height="12" rx="2" fill="#f2f2ef" stroke="#656560" stroke-width="1"/><text x="360" y="697" class="tag" text-anchor="middle">PLANNED</text>
      </svg>
    </div>
  </main>
</body>
</html>
